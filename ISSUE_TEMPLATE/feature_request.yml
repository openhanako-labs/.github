name: 功能请求
description: 建议一个新功能或改进
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      description: 希望增加或改进什么
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 使用场景、当前 workaround
  - type: textarea
    id: idea
    attributes:
      label: 你的方案
      description: 可选。如果你已经想过实现思路
  - type: checkboxes
    id: notes
    attributes:
      label: 备注
      options:
        - 我可以自己提 PR
