name: Bug 报告
description: 报告一个 bug
labels: ["bug", "待确认"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 简短描述问题
      placeholder: 一句话概括
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何稳定复现
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Hana 版本、系统、插件版本等
      placeholder: |
        - Hana: 
        - OS:
        - Plugin:
